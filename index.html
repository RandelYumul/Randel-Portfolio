    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- The 3 fonts: Montserrat (headings), Syne (hero title + small titles), Open Sans (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Open+Sans:wght@400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
    <title>Randel Yumul | Portfolio</title>

    <!-- Link preview: what LinkedIn, Messenger, Discord, etc. show when someone shares your link.
         These need FULL https:// addresses (not /images/...). -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://randelyumul.github.io/Randel-Portfolio/" />
    <meta property="og:title" content="Randel Yumul | Portfolio" />
    <meta property="og:description" content="Computer Science student building web, mobile, and game projects, from award-winning hackathon apps to full-stack builds." />
    <meta property="og:image" content="https://randelyumul.github.io/Randel-Portfolio/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#051f20" />
    <!-- Sets the theme BEFORE the page draws, so there is no flash of the wrong colors -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="/Randel-Portfolio/assets/index-Cq3j_xSu.js"></script>
    <link rel="stylesheet" crossorigin href="/Randel-Portfolio/assets/index-C_Ir5k0t.css">
